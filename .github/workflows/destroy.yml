name: "Destroy AWS Infrastructure"

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Escribe "destroy" para confirmar la eliminacion completa de la infraestructura'
        required: true
        default: ''

permissions:
  contents: read

jobs:
  destroy:
    name: "Terraform Destroy"
    if: ${{ github.event.inputs.confirmation == 'destroy' }}
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ secrets.AWS_REGION != '' && secrets.AWS_REGION || 'us-east-1' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"
          terraform_wrapper: false

      # ------------------------------------------------------------------
      # Leer outputs del bootstrap para obtener el nombre del bucket y
      # la tabla DynamoDB sin hardcodearlos.
      # El bootstrap NO se destruye aqui: el bucket de state debe
      # sobrevivir para futuros re-deploys.
      # ------------------------------------------------------------------
      - name: Bootstrap Init
        run: terraform init
        working-directory: bootstrap

      - name: Read Bootstrap Outputs
        id: bootstrap
        run: |
          echo "bucket=$(terraform output -raw state_bucket_name)" >> $GITHUB_OUTPUT
          echo "table=$(terraform output -raw dynamodb_table_name)"  >> $GITHUB_OUTPUT
          echo "region=$(terraform output -raw aws_region)"          >> $GITHUB_OUTPUT
        working-directory: bootstrap

      # ------------------------------------------------------------------
      # STACK PRINCIPAL: destruir todos los recursos de negocio
      # ------------------------------------------------------------------
      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ steps.bootstrap.outputs.bucket }}" \
            -backend-config="key=terraform.tfstate" \
            -backend-config="region=${{ steps.bootstrap.outputs.region }}" \
            -backend-config="dynamodb_table=${{ steps.bootstrap.outputs.table }}" \
            -backend-config="encrypt=true"

      - name: Terraform Destroy
        run: terraform destroy -auto-approve -no-color

      - name: Output Destroy Summary
        run: |
          echo "### Infraestructura Destruida con Exito" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Todos los recursos de AWS del stack principal han sido eliminados." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> El bucket de state **${{ steps.bootstrap.outputs.bucket }}** y la tabla DynamoDB" >> $GITHUB_STEP_SUMMARY
          echo "> **${{ steps.bootstrap.outputs.table }}** se conservan para futuros re-deploys." >> $GITHUB_STEP_SUMMARY
          echo "> Para eliminarlos definitivamente, ejecuta el workflow **Destroy Bootstrap**." >> $GITHUB_STEP_SUMMARY
